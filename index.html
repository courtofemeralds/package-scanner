<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }
    #app { max-width: 420px; margin: 0 auto; padding: 1rem; }
    .header { text-align: center; padding: 1.5rem 0 1rem; border-bottom: 1px solid #e0e0d8; margin-bottom: 1.5rem; }
    .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; margin-top: 0.75rem; }
    .header p { font-size: 14px; color: #888; margin-top: 4px; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #1a1a2e; margin-bottom: 12px; transition: background 0.15s; }
    .btn:hover { background: #f0f0ea; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    .btn-primary:hover { background: #16213e; }
    #manual-section { margin-bottom: 1.5rem; display: none; }
    #manual-section.open { display: block; }
    .input-row { display: flex; gap: 8px; }
    #tracking-input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a2e; font-size: 15px; }
    #tracking-input:focus { outline: none; border-color: #1a1a2e; box-shadow: 0 0 0 2px rgba(26,26,46,0.15); }
    .submit-btn { padding: 10px 16px; border-radius: 8px; background: #1a1a2e; color: #fff; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
    .submit-btn:active { transform: scale(0.97); }
    .history-label { font-size: 12px; font-weight: 600; color: #888; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px; }
    .history-list { border: 1px solid #e0e0d8; border-radius: 12px; overflow: hidden; background: #fff; }
    .history-item { padding: 12px 16px; border-bottom: 1px solid #f0f0ea; }
    .history-item:last-child { border-bottom: none; }
    .tracking-num { font-size: 14px; font-weight: 600; color: #1a1a2e; font-family: 'Courier New', monospace; word-break: break-all; }
    .scan-meta { font-size: 12px; color: #888; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
    .method-badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; }
    .badge-scan { background: #e1f5ee; color: #0f6e56; }
    .badge-manual { background: #e6f1fb; color: #185fa5; }
    .empty-state { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
    #camera-section { display: none; margin-bottom: 1.5rem; }
    #camera-section.open { display: block; }
    video { width: 100%; border-radius: 12px; border: 1px solid #ddd; background: #000; display: block; }
    .cam-hint { font-size: 12px; color: #888; text-align: center; margin-top: 6px; }
    .status-msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: none; }
    .status-msg.show { display: block; }
    .status-success { background: #e1f5ee; color: #0f6e56; }
    .status-error { background: #fcebeb; color: #a32d2d; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="8" width="3" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="7" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="11" y="8" width="4" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="17" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="21" y="8" width="3" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="26" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="30" y="8" width="4" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="36" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
      </svg>
      <h1>Package Scanner</h1>
      <p>Scan barcodes or enter tracking numbers</p>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <button class="btn btn-primary" id="scan-btn" onclick="toggleCamera()">Scan a Package</button>

    <div id="camera-section">
      <video id="video" autoplay playsinline muted></video>
      <p class="cam-hint">Point camera at a Code 128 barcode</p>
      <button class="btn" style="margin-top:10px" onclick="stopCamera()">Cancel</button>
    </div>

    <button class="btn" id="manual-btn" onclick="toggleManual()">Enter Tracking # Manually</button>

    <div id="manual-section">
      <div class="input-row">
        <input type="text" id="tracking-input" placeholder="Enter tracking number..." autocomplete="off" />
        <button class="submit-btn" onclick="submitManual()">Save</button>
      </div>
    </div>

    <div style="margin-top: 1.5rem;">
      <div class="history-label">Scan history</div>
      <div class="history-list" id="history-list">
        <div class="empty-state">No scans yet</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script>
    let history = [];
    let codeReader = null;
    let scanning = false;

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status-msg show status-' + type;
      setTimeout(() => { el.className = 'status-msg'; }, 3000);
    }

    function addScan(value, method) {
      const now = new Date();
      const timeStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' — ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      history.unshift({ value, method, time: timeStr });
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      if (history.length === 0) {
        list.innerHTML = '<div class="empty-state">No scans yet</div>';
        return;
      }
      list.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="tracking-num">${item.value}</div>
          <div class="scan-meta">
            <span>${item.time}</span>
            <span class="method-badge ${item.method === 'scan' ? 'badge-scan' : 'badge-manual'}">${item.method === 'scan' ? 'Scanned' : 'Manual'}</span>
          </div>
        </div>
      `).join('');
    }

    function toggleManual() {
      const sec = document.getElementById('manual-section');
      const isOpen = sec.classList.contains('open');
      sec.classList.toggle('open', !isOpen);
      document.getElementById('manual-btn').textContent = isOpen ? 'Enter Tracking # Manually' : 'Hide Manual Entry';
      if (!isOpen) setTimeout(() => document.getElementById('tracking-input').focus(), 50);
    }

    function submitManual() {
      const input = document.getElementById('tracking-input');
      const val = input.value.trim();
      if (!val) { showStatus('Please enter a tracking number.', 'error'); return; }
      addScan(val, 'manual');
      input.value = '';
      showStatus('Tracking number saved!', 'success');
    }

    document.getElementById('tracking-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitManual();
    });

    async function toggleCamera() {
      const sec = document.getElementById('camera-section');
      if (sec.classList.contains('open')) { stopCamera(); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showStatus('Camera not supported in this browser. Try Safari on iPhone.', 'error');
        return;
      }
      sec.classList.add('open');
      document.getElementById('scan-btn').textContent = 'Stop Scanning';
      try {
        const ZXing = window.ZXing;
        codeReader = new ZXing.BrowserMultiFormatReader();
        const videoEl = document.getElementById('video');
        scanning = true;
        await codeReader.decodeFromConstraints(
          { video: { facingMode: 'environment' } },
          videoEl,
          (result, err) => {
            if (result && scanning) {
              scanning = false;
              addScan(result.getText(), 'scan');
              showStatus('Barcode scanned successfully!', 'success');
              stopCamera();
            }
          }
        );
      } catch (err) {
        showStatus('Could not access camera. Please allow camera permission.', 'error');
        stopCamera();
      }
    }

    function stopCamera() {
      scanning = false;
      if (codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }
      document.getElementById('camera-section').classList.remove('open');
      document.getElementById('scan-btn').textContent = 'Scan a Package';
    }
  </script>
</body>
</html>
