<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }
    #app { max-width: 420px; margin: 0 auto; padding: 1rem; }
    .header { text-align: center; padding: 1.5rem 0 1rem; border-bottom: 1px solid #e0e0d8; margin-bottom: 1.5rem; }
    .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; margin-top: 0.75rem; }
    .header p { font-size: 14px; color: #888; margin-top: 4px; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; border: 1px solid #ddd; background: #fff; color: #1a1a2e; margin-bottom: 12px; transition: background 0.15s; }
    .btn:hover { background: #f0f0ea; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
    .btn-primary:hover { background: #16213e; }
    .btn-export { background: #1a4a2e; color: #fff; border-color: #1a4a2e; }
    .btn-export:hover { background: #153d25; }
    .btn-email { background: #1a2e4a; color: #fff; border-color: #1a2e4a; }
    .btn-email:hover { background: #152540; }
    .btn-danger { background: #fff; color: #a32d2d; border-color: #f0c0c0; font-size: 13px; padding: 10px; }
    .btn-danger:hover { background: #fcebeb; }
    .btn-export:disabled, .btn-email:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }
    .export-row { display: flex; gap: 8px; margin-top: 12px; }
    .export-row .btn { margin-bottom: 0; flex: 1; padding: 12px 8px; font-size: 13px; }
    #manual-section { margin-bottom: 1.5rem; display: none; }
    #manual-section.open { display: block; }
    .input-row { display: flex; gap: 8px; }
    #tracking-input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #1a1a2e; font-size: 15px; }
    #tracking-input:focus { outline: none; border-color: #1a1a2e; box-shadow: 0 0 0 2px rgba(26,26,46,0.15); }
    .submit-btn { padding: 10px 16px; border-radius: 8px; background: #1a1a2e; color: #fff; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
    .submit-btn:active { transform: scale(0.97); }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .history-label { font-size: 12px; font-weight: 600; color: #888; letter-spacing: 0.07em; text-transform: uppercase; }
    .history-count { font-size: 12px; color: #aaa; }
    .history-list { border: 1px solid #e0e0d8; border-radius: 12px; overflow: hidden; background: #fff; }
    .history-item { padding: 12px 16px; border-bottom: 1px solid #f0f0ea; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .history-item:last-child { border-bottom: none; }
    .history-item-info { flex: 1; min-width: 0; }
    .tracking-num { font-size: 14px; font-weight: 600; color: #1a1a2e; font-family: 'Courier New', monospace; word-break: break-all; }
    .scan-meta { font-size: 12px; color: #888; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .method-badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; }
    .badge-scan { background: #e1f5ee; color: #0f6e56; }
    .badge-manual { background: #e6f1fb; color: #185fa5; }
    .delete-btn { flex-shrink: 0; background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: #ccc; font-size: 16px; line-height: 1; transition: color 0.15s, background 0.15s; }
    .delete-btn:hover { color: #a32d2d; background: #fcebeb; }
    .empty-state { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
    #camera-section { display: none; margin-bottom: 1.5rem; }
    #camera-section.open { display: block; }
    video { width: 100%; border-radius: 12px; border: 1px solid #ddd; background: #000; display: block; }
    .cam-hint { font-size: 12px; color: #888; text-align: center; margin-top: 6px; }
    .status-msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: none; }
    .status-msg.show { display: block; }
    .status-success { background: #e1f5ee; color: #0f6e56; }
    .status-error { background: #fcebeb; color: #a32d2d; }
    .email-hint { font-size: 11px; color: #aaa; text-align: center; margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="8" width="3" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="7" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="11" y="8" width="4" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="17" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="21" y="8" width="3" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="26" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="30" y="8" width="4" height="24" fill="#1a1a2e" rx="1"/>
        <rect x="36" y="8" width="2" height="24" fill="#1a1a2e" rx="1"/>
      </svg>
      <h1>Package Scanner</h1>
      <p>Scan barcodes or enter tracking numbers</p>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <button class="btn btn-primary" id="scan-btn" onclick="toggleCamera()">Scan a Package</button>

    <div id="camera-section">
      <video id="video" autoplay playsinline muted></video>
      <p class="cam-hint">Point camera at a Code 128 barcode</p>
      <button class="btn" style="margin-top:10px" onclick="stopCamera()">Cancel</button>
    </div>

    <button class="btn" id="manual-btn" onclick="toggleManual()">Enter Tracking # Manually</button>

    <div id="manual-section">
      <div class="input-row">
        <input type="text" id="tracking-input" placeholder="Enter tracking number..." autocomplete="off" />
        <button class="submit-btn" onclick="submitManual()">Save</button>
      </div>
    </div>

    <div style="margin-top: 1.5rem;">
      <div class="history-header">
        <span class="history-label">Scan history</span>
        <span class="history-count" id="history-count"></span>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-state">No scans yet</div>
      </div>
      <div class="export-row">
        <button class="btn btn-export" id="export-btn" onclick="exportCSV()" disabled>Export CSV</button>
        <button class="btn btn-email" id="email-btn" onclick="emailCSV()" disabled>Email CSV</button>
      </div>
      <button class="btn btn-danger" id="clear-btn" onclick="clearAll()" style="display:none;">Clear All History</button>
      <p class="email-hint" id="email-hint" style="display:none;">The CSV will download and your Mail app will open.<br>Attach the file from your Files app before sending.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  <script>
    const STORAGE_KEY = 'packageScanHistory';
    let history = [];
    let codeReader = null;
    let scanning = false;

    function loadFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) history = JSON.parse(saved);
      } catch(e) { history = []; }
      renderHistory();
    }

    function saveToStorage() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch(e) {}
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.className = 'status-msg show status-' + type;
      setTimeout(() => { el.className = 'status-msg'; }, 4000);
    }

    function addScan(value, method) {
      const now = new Date();
      const timeStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      history.unshift({ id: Date.now(), value, method, time: timeStr });
      saveToStorage();
      renderHistory();
    }

    function deleteScan(id) {
      history = history.filter(item => item.id !== id);
      saveToStorage();
      renderHistory();
      showStatus('Entry removed.', 'success');
    }

    function clearAll() {
      if (!confirm('Clear all scan history? This cannot be undone.')) return;
      history = [];
      saveToStorage();
      renderHistory();
      showStatus('History cleared.', 'success');
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const countEl = document.getElementById('history-count');
      const exportBtn = document.getElementById('export-btn');
      const emailBtn = document.getElementById('email-btn');
      const clearBtn = document.getElementById('clear-btn');
      const emailHint = document.getElementById('email-hint');

      if (history.length === 0) {
        list.innerHTML = '<div class="empty-state">No scans yet</div>';
        countEl.textContent = '';
        exportBtn.disabled = true;
        emailBtn.disabled = true;
        clearBtn.style.display = 'none';
        emailHint.style.display = 'none';
        return;
      }

      countEl.textContent = history.length + ' total';
      exportBtn.disabled = false;
      emailBtn.disabled = false;
      clearBtn.style.display = 'block';
      emailHint.style.display = 'block';

      list.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-item-info">
            <div class="tracking-num">${item.value}</div>
            <div class="scan-meta">
              <span>${item.time}</span>
              <span class="method-badge ${item.method === 'scan' ? 'badge-scan' : 'badge-manual'}">${item.method === 'scan' ? 'Scanned' : 'Manual'}</span>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteScan(${item.id})" title="Remove">&#x2715;</button>
        </div>
      `).join('');
    }

    function buildCSV() {
      const rows = [['Tracking Number', 'Date & Time', 'Method']];
      history.forEach(item => {
        rows.push([item.value, item.time, item.method === 'scan' ? 'Scanned' : 'Manual']);
      });
      return rows.map(r => r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\n');
    }

    function exportCSV() {
      if (history.length === 0) return;
      const csv = buildCSV();
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'package-scans-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
      showStatus('CSV downloaded successfully!', 'success');
    }

    function emailCSV() {
      if (history.length === 0) return;
      exportCSV();
      const dateStr = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      const subject = encodeURIComponent('Package Scans — ' + dateStr);
      const body = encodeURIComponent('Hi,\n\nPlease find the package scan report for ' + dateStr + ' attached.\n\nTotal packages: ' + history.length + '\n\nSent from Package Scanner.');
      setTimeout(() => { window.location.href = 'mailto:?subject=' + subject + '&body=' + body; }, 400);
      showStatus('CSV downloaded — attach it in your Mail app!', 'success');
    }

    function toggleManual() {
      const sec = document.getElementById('manual-section');
      const isOpen = sec.classList.contains('open');
      sec.classList.toggle('open', !isOpen);
      document.getElementById('manual-btn').textContent = isOpen ? 'Enter Tracking # Manually' : 'Hide Manual Entry';
      if (!isOpen) setTimeout(() => document.getElementById('tracking-input').focus(), 50);
    }

    function submitManual() {
      const input = document.getElementById('tracking-input');
      const val = input.value.trim();
      if (!val) { showStatus('Please enter a tracking number.', 'error'); return; }
      addScan(val, 'manual');
      input.value = '';
      showStatus('Tracking number saved!', 'success');
    }

    document.getElementById('tracking-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitManual();
    });

    async function toggleCamera() {
      const sec = document.getElementById('camera-section');
      if (sec.classList.contains('open')) { stopCamera(); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showStatus('Camera not supported in this browser. Try Safari on iPhone.', 'error');
        return;
      }
      sec.classList.add('open');
      document.getElementById('scan-btn').textContent = 'Stop Scanning';
      try {
        const ZXing = window.ZXing;
        codeReader = new ZXing.BrowserMultiFormatReader();
        const videoEl = document.getElementById('video');
        scanning = true;
        await codeReader.decodeFromConstraints(
          { video: { facingMode: 'environment' } },
          videoEl,
          (result, err) => {
            if (result && scanning) {
              scanning = false;
              addScan(result.getText(), 'scan');
              showStatus('Barcode scanned successfully!', 'success');
              stopCamera();
            }
          }
        );
      } catch (err) {
        showStatus('Could not access camera. Please allow camera permission.', 'error');
        stopCamera();
      }
    }

    function stopCamera() {
      scanning = false;
      if (codeReader) { try { codeReader.reset(); } catch(e){} codeReader = null; }
      document.getElementById('camera-section').classList.remove('open');
      document.getElementById('scan-btn').textContent = 'Scan a Package';
    }

    loadFromStorage();
  </script>
</body>
</html>
